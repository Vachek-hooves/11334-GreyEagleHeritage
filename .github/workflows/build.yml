name: Build Release

on:
  push:
    branches:
      - 'prod**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Decode upload keystore
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > GreyEagleHeritage-upload-key.keystore

      - name: Build release AAB + APK
        working-directory: android
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "release-${{ github.run_number }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            android/app/build/outputs/apk/release/app-release.apk \
            --target "${{ github.sha }}" \
            --title "Release build ${{ github.run_number }}"
